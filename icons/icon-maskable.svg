    <circle cx="32" cy="36.5" r="18.8" fill="#fffbeb" stroke="#78350f" stroke-width="1.6"/>
    <path d="M 32 22.5 A 14 14 0 0 1 41.9 46.4" fill="none" stroke="#10b981" stroke-width="4.4" stroke-linecap="round"/>

