<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brass" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Top pocket-watch bow ring & crown -->
  <circle cx="32" cy="8.5" r="4.8" fill="none" stroke="#451a03" stroke-width="5.6"/>
  <circle cx="32" cy="8.5" r="4.8" fill="none" stroke="url(#brass)" stroke-width="3.2"/>
  <rect x="27.5" y="10" width="9" height="6" rx="2" fill="url(#brass)" stroke="#451a03" stroke-width="1.4"/>

  <!-- Outer brass watch bezel -->
  <circle cx="32" cy="36.5" r="24.5" fill="url(#brass)" stroke="#451a03" stroke-width="1.8"/>

  <!-- Warm ivory dial -->
  <circle cx="32" cy="36.5" r="18.8" fill="#fffbeb" stroke="#78350f" stroke-width="1.6"/>

  <!-- Emerald progress arc (12:00 to 4:30) -->
  <path d="M 32 22.5 A 14 14 0 0 1 41.9 46.4" fill="none" stroke="#10b981" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 4 cardinal hour dots -->
  <circle cx="32" cy="20.7" r="1.6" fill="#78350f"/>
  <circle cx="47.8" cy="36.5" r="1.6" fill="#78350f"/>
  <circle cx="32" cy="52.3" r="1.6" fill="#78350f"/>
  <circle cx="16.2" cy="36.5" r="1.6" fill="#78350f"/>

  <!-- High-contrast bold clock hands & center pivot -->
  <line x1="32" y1="36.5" x2="32" y2="24.5" stroke="#291509" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="36.5" x2="40.5" y2="45" stroke="#291509" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="32" cy="36.5" r="3.4" fill="#d97706" stroke="#fffbeb" stroke-width="1.3"/>
</svg>
